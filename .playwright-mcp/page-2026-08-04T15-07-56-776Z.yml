            - heading [level=5] [ref=f7e229]
            - paragraph [ref=f7e233]: HammaDev turns agent history into an evidence-aware execution contract — durable knowledge, immutable task epochs, git reconciliation, and readiness assessment. No cloud. No telemetry. Trust the repository when handoffs conflict with live state.
          - generic [ref=f7e235]:
            - heading [level=5] [ref=f7e240]
            - paragraph [ref=f7e244]: Built for air-gapped and high-trust environments. AI traffic is hard-locked to loopback. Includes a fine-tuned DevOps model, visual SFTP, fleet dashboard, and zero-trust security across Linux, Windows, macOS, Android, and iOS.
          - generic [ref=f7e246]:
            - heading [level=5] [ref=f7e251]
            - paragraph [ref=f7e255]: Event-sourced multi-agent collaboration with adversarial critique routing, Zod-validated structured outputs, cost governance, and human-in-the-room directives. Built for the Qwen Cloud Global AI Hackathon — Agent Society track.
