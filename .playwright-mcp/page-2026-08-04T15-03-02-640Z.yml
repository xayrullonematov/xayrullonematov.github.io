            - heading [level=5] [ref=f2e260]
            - paragraph [ref=f2e264]: Built for air-gapped and high-trust environments. AI traffic is hard-locked to loopback. Includes a fine-tuned DevOps model, visual SFTP, fleet dashboard, and zero-trust security across Linux, Windows, macOS, Android, and iOS.
          - generic [ref=f2e266]:
            - heading [level=5] [ref=f2e271]
            - paragraph [ref=f2e275]: Event-sourced multi-agent collaboration with adversarial critique routing, Zod-validated structured outputs, cost governance, and human-in-the-room directives. Built for the Qwen Cloud Global AI Hackathon — Agent Society track.
